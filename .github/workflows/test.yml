name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        # NO `version` input: the action reads `packageManager` from package.json.
        # Setting both fails with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      # The published .d.ts files must only import packages declared in
      # dependencies or peerDependencies (a devDependency is invisible to consumers).
      - name: Published types declare their imports
        run: pnpm check:type-deps

      # Includes test/types.test.ts, whose assertions only tsc checks.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
